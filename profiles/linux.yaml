{
  "os": "linux",
  "version": 1,
  "controls": [
    {
      "parameter": "Kernel: Restrict dmesg",
      "category": "Kernel & Boot",
      "cis_id": "CIS 1.5.4",
      "severity": "low",
      "mitigation": "kernel.dmesg_restrict=1.",
      "check": {
        "type": "sysctl",
        "path": "kernel.dmesg_restrict",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "Kernel: Restrict kptr",
      "category": "Kernel & Boot",
      "cis_id": "CIS 1.5.5",
      "severity": "low",
      "mitigation": "kernel.kptr_restrict=1 atau 2.",
      "check": {
        "type": "sysctl",
        "path": "kernel.kptr_restrict",
        "expect": [
          "1",
          "2"
        ]
      }
    },
    {
      "parameter": "Kernel: ptrace Scope",
      "category": "Kernel & Boot",
      "cis_id": "CIS 1.5.6",
      "severity": "medium",
      "mitigation": "kernel.yama.ptrace_scope=1..3.",
      "check": {
        "type": "sysctl",
        "path": "kernel.yama.ptrace_scope",
        "expect": [
          "1",
          "2",
          "3"
        ]
      }
    },
    {
      "parameter": "Kernel: SUID Dumpable",
      "category": "Kernel & Boot",
      "cis_id": "CIS 1.5.2",
      "severity": "low",
      "mitigation": "fs.suid_dumpable=0.",
      "check": {
        "type": "sysctl",
        "path": "fs.suid_dumpable",
        "expect": [
          "0"
        ]
      }
    },
    {
      "parameter": "Kernel: Protected Hardlinks",
      "category": "Kernel & Boot",
      "cis_id": "CIS 1.5.7",
      "severity": "medium",
      "mitigation": "fs.protected_hardlinks=1.",
      "check": {
        "type": "sysctl",
        "path": "fs.protected_hardlinks",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "Kernel: Protected Symlinks",
      "category": "Kernel & Boot",
      "cis_id": "CIS 1.5.8",
      "severity": "medium",
      "mitigation": "fs.protected_symlinks=1.",
      "check": {
        "type": "sysctl",
        "path": "fs.protected_symlinks",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "Network: Reverse Path Filtering",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.7",
      "severity": "medium",
      "mitigation": "rp_filter=1.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.conf.all.rp_filter",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "Network: Reject Source Routing",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.1",
      "severity": "medium",
      "mitigation": "accept_source_route=0.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.conf.all.accept_source_route",
        "expect": [
          "0"
        ]
      }
    },
    {
      "parameter": "Network: Secure ICMP Redirects",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.3",
      "severity": "low",
      "mitigation": "secure_redirects=0.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.conf.all.secure_redirects",
        "expect": [
          "0"
        ]
      }
    },
    {
      "parameter": "Network: Disable Send Redirects",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.5",
      "severity": "low",
      "mitigation": "send_redirects=0.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.conf.all.send_redirects",
        "expect": [
          "0"
        ]
      }
    },
    {
      "parameter": "Network: Log Martian Packets",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.4",
      "severity": "low",
      "mitigation": "log_martians=1.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.conf.all.log_martians",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "Network: Ignore Broadcast ICMP",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.6",
      "severity": "low",
      "mitigation": "icmp_echo_ignore_broadcasts=1.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.icmp_echo_ignore_broadcasts",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "Network: TCP SYN Cookies",
      "category": "Network & Port",
      "cis_id": "CIS 3.2.8",
      "severity": "medium",
      "mitigation": "tcp_syncookies=1.",
      "check": {
        "type": "sysctl",
        "path": "net.ipv4.tcp_syncookies",
        "expect": [
          "1"
        ]
      }
    },
    {
      "parameter": "SSH: Client Alive Interval",
      "category": "Access Control",
      "cis_id": "CIS 5.2.16",
      "severity": "low",
      "mitigation": "ClientAliveInterval <= 300.",
      "check": {
        "type": "sshd",
        "directive": "ClientAliveInterval",
        "expect": "300"
      },
      "na_if": "program_missing:sshd"
    },
    {
      "parameter": "SSH: Client Alive Count Max",
      "category": "Access Control",
      "cis_id": "CIS 5.2.17",
      "severity": "low",
      "mitigation": "ClientAliveCountMax <= 3.",
      "check": {
        "type": "sshd",
        "directive": "ClientAliveCountMax",
        "expect": "3"
      },
      "na_if": "program_missing:sshd"
    },
    {
      "parameter": "SSH: X11 Forwarding",
      "category": "Access Control",
      "cis_id": "CIS 5.2.7",
      "severity": "low",
      "mitigation": "X11Forwarding=no.",
      "check": {
        "type": "sshd",
        "directive": "X11Forwarding",
        "expect": "no"
      },
      "na_if": "program_missing:sshd"
    },
    {
      "parameter": "SSH: Log Level",
      "category": "System Logging",
      "cis_id": "CIS 5.2.9",
      "severity": "low",
      "mitigation": "LogLevel VERBOSE atau INFO.",
      "check": {
        "type": "sshd",
        "directive": "LogLevel",
        "expect": "verbose"
      },
      "na_if": "program_missing:sshd"
    },
    {
      "parameter": "SSH: Banner",
      "category": "Access Control",
      "cis_id": "CIS 5.2.15",
      "severity": "low",
      "mitigation": "Pasang Banner.",
      "check": {
        "type": "sshd",
        "directive": "Banner",
        "expect": "/etc/issue.net"
      },
      "na_if": "program_missing:sshd"
    },
    {
      "parameter": "/etc/ssh/sshd_config Permissions",
      "category": "Access Control",
      "cis_id": "CIS 5.2.1",
      "severity": "medium",
      "mitigation": "Mode maksimal 600.",
      "check": {
        "type": "file_mode",
        "path": "/etc/ssh/sshd_config",
        "max": 600
      },
      "na_if": "program_missing:sshd"
    },
    {
      "parameter": "/etc/cron.d Permissions",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.3",
      "severity": "medium",
      "mitigation": "Mode maksimal 700.",
      "check": {
        "type": "file_mode",
        "path": "/etc/cron.d",
        "max": 700
      }
    },
    {
      "parameter": "/etc/cron.daily Permissions",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.4",
      "severity": "medium",
      "mitigation": "Mode maksimal 700.",
      "check": {
        "type": "file_mode",
        "path": "/etc/cron.daily",
        "max": 700
      }
    },
    {
      "parameter": "/etc/cron.hourly Permissions",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.5",
      "severity": "low",
      "mitigation": "Mode maksimal 700.",
      "check": {
        "type": "file_mode",
        "path": "/etc/cron.hourly",
        "max": 700
      }
    },
    {
      "parameter": "/etc/cron.weekly Permissions",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.6",
      "severity": "low",
      "mitigation": "Mode maksimal 700.",
      "check": {
        "type": "file_mode",
        "path": "/etc/cron.weekly",
        "max": 700
      }
    },
    {
      "parameter": "/etc/cron.monthly Permissions",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.7",
      "severity": "low",
      "mitigation": "Mode maksimal 700.",
      "check": {
        "type": "file_mode",
        "path": "/etc/cron.monthly",
        "max": 700
      }
    },
    {
      "parameter": "cron.allow Present",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.8",
      "severity": "low",
      "mitigation": "Batasi cron dengan /etc/cron.allow.",
      "check": {
        "type": "exists",
        "path": "/etc/cron.allow",
        "want": true
      }
    },
    {
      "parameter": "at.allow Present",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.1.9",
      "severity": "low",
      "mitigation": "Batasi at dengan /etc/at.allow.",
      "check": {
        "type": "exists",
        "path": "/etc/at.allow",
        "want": true
      }
    },
    {
      "parameter": "login.defs: PASS_MAX_DAYS",
      "category": "Access Control",
      "cis_id": "CIS 5.4.1.1",
      "severity": "medium",
      "mitigation": "PASS_MAX_DAYS <= 365.",
      "check": {
        "type": "file_content",
        "path": "/etc/login.defs",
        "require": [
          "^\\s*PASS_MAX_DAYS\\s+([1-9]|[1-9][0-9]|[1-2][0-9]{2}|3[0-5][0-9]|36[0-5])\\s*$"
        ]
      }
    },
    {
      "parameter": "login.defs: PASS_MIN_DAYS",
      "category": "Access Control",
      "cis_id": "CIS 5.4.1.2",
      "severity": "low",
      "mitigation": "PASS_MIN_DAYS >= 1.",
      "check": {
        "type": "file_content",
        "path": "/etc/login.defs",
        "require": [
          "^\\s*PASS_MIN_DAYS\\s+[1-9][0-9]*\\s*$"
        ]
      }
    },
    {
      "parameter": "login.defs: PASS_WARN_AGE",
      "category": "Access Control",
      "cis_id": "CIS 5.4.1.3",
      "severity": "low",
      "mitigation": "PASS_WARN_AGE >= 7.",
      "check": {
        "type": "file_content",
        "path": "/etc/login.defs",
        "require": [
          "^\\s*PASS_WARN_AGE\\s+([7-9]|[1-9][0-9]+)\\s*$"
        ]
      }
    },
    {
      "parameter": "login.defs: Encryption Method",
      "category": "Cryptographic Posture",
      "cis_id": "CIS 5.4.4",
      "severity": "high",
      "mitigation": "ENCRYPT_METHOD YESCRYPT atau SHA512.",
      "check": {
        "type": "file_content",
        "path": "/etc/login.defs",
        "require": [
          "^\\s*ENCRYPT_METHOD\\s+(YESCRYPT|SHA512)\\s*$"
        ]
      }
    },
    {
      "parameter": "PAM: faillock deny",
      "category": "Access Control",
      "cis_id": "CIS 5.4.2",
      "severity": "medium",
      "mitigation": "pam_faillock deny <= 5.",
      "check": {
        "type": "file_content",
        "path": "/etc/security/faillock.conf",
        "require": [
          "^\\s*deny\\s*=\\s*[1-5]\\s*$"
        ]
      }
    },
    {
      "parameter": "PAM: pwquality minclass",
      "category": "Access Control",
      "cis_id": "CIS 5.4.1",
      "severity": "medium",
      "mitigation": "minclass >= 3.",
      "check": {
        "type": "file_content",
        "path": "/etc/security/pwquality.conf",
        "require": [
          "^\\s*minclass\\s*=\\s*[3-4]\\s*$"
        ]
      }
    },
    {
      "parameter": "Password Quality Package Installed",
      "category": "Access Control",
      "cis_id": "CIS 5.4.1",
      "severity": "medium",
      "mitigation": "Pasang libpam-pwquality.",
      "check": {
        "type": "command",
        "argv": [
          "dpkg",
          "-s",
          "libpam-pwquality"
        ],
        "expect_exit": 0,
        "timeout": 10
      },
      "na_if": "program_missing:dpkg"
    },
    {
      "parameter": "AppArmor Active",
      "category": "Endpoint Protection",
      "cis_id": "CIS 1.6.1.2",
      "severity": "high",
      "mitigation": "Aktifkan AppArmor.",
      "check": {
        "type": "service",
        "name": "apparmor",
        "expect": "running"
      }
    },
    {
      "parameter": "Avahi Daemon Disabled",
      "category": "Network & Port",
      "cis_id": "CIS 2.2.4",
      "severity": "low",
      "mitigation": "Matikan avahi-daemon bila tidak perlu.",
      "check": {
        "type": "service",
        "name": "avahi-daemon",
        "expect": "disabled"
      }
    },
    {
      "parameter": "CUPS Disabled",
      "category": "Network & Port",
      "cis_id": "CIS 2.2.5",
      "severity": "low",
      "mitigation": "Matikan cups bila tidak ada printer.",
      "check": {
        "type": "service",
        "name": "cups",
        "expect": "disabled"
      }
    },
    {
      "parameter": "RPCBIND Disabled",
      "category": "Network & Port",
      "cis_id": "CIS 2.2.6",
      "severity": "low",
      "mitigation": "Matikan rpcbind bila tanpa NFS.",
      "check": {
        "type": "service",
        "name": "rpcbind",
        "expect": "disabled"
      }
