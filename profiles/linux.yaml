    {
      "parameter": "Bluetooth Disabled",
      "category": "Endpoint Protection",
      "cis_id": "CIS 2.2.7",
      "severity": "low",
      "mitigation": "Matikan bluetooth di server.",
      "check": {
        "type": "service",
        "name": "bluetooth",
        "expect": "disabled"
      }
    },
    {
      "parameter": "Auditd Package Installed",
      "category": "System Logging",
      "cis_id": "CIS 4.1.1",
      "severity": "high",
      "mitigation": "Pasang paket auditd.",
      "check": {
        "type": "command",
        "argv": [
          "dpkg",
          "-s",
          "auditd"
        ],
        "expect_exit": 0,
        "timeout": 10
      },
      "na_if": "program_missing:dpkg"
    },
    {
      "parameter": "AIDE Configuration Present",
      "category": "System Logging",
      "cis_id": "CIS 1.3.1",
      "severity": "medium",
      "mitigation": "Sediakan /etc/aide/aide.conf.",
      "check": {
        "type": "exists",
        "path": "/etc/aide/aide.conf",
        "want": true
      }
    },
    {
      "parameter": "Auditd Rules Directory",
      "category": "System Logging",
      "cis_id": "CIS 4.1.2",
      "severity": "medium",
      "mitigation": "Sediakan /etc/audit/rules.d.",
      "check": {
        "type": "exists",
        "path": "/etc/audit/rules.d",
        "want": true
      }
    },
    {
      "parameter": "Unattended Upgrades Installed",
      "category": "Endpoint Protection",
      "cis_id": "CIS 1.9",
      "severity": "medium",
      "mitigation": "Pasang unattended-upgrades.",
      "check": {
        "type": "command",
        "argv": [
          "dpkg",
          "-s",
          "unattended-upgrades"
        ],
        "expect_exit": 0,
        "timeout": 10
      },
      "na_if": "program_missing:dpkg"
    },
    {
      "parameter": "systemd-journald Persistent",
      "category": "System Logging",
      "cis_id": "CIS 4.2.1.1",
      "severity": "low",
      "mitigation": "Storage=persistent pada journald.conf.",
      "check": {
        "type": "file_content",
        "path": "/etc/systemd/journald.conf",
        "require": [
          "^\\s*Storage\\s*=\\s*persistent\\s*$"
        ]
      }
    },
    {
      "parameter": "Sudo: use_pty",
      "category": "Privilege Boundary",
      "cis_id": "CIS 5.3.3",
      "severity": "medium",
      "mitigation": "Defaults use_pty.",
      "check": {
        "type": "file_content",
        "path": "/etc/sudoers",
        "require": [
          "^\\s*Defaults\\s+.*use_pty"
        ]
      }
    },
    {
      "parameter": "Sudo: log_input/log_output",
      "category": "System Logging",
      "cis_id": "CIS 5.3.5",
      "severity": "low",
      "mitigation": "Defaults log_input, log_output.",
      "check": {
        "type": "file_content",
        "path": "/etc/sudoers",
        "require": [
          "^\\s*Defaults\\s+.*log_output"
        ]
      }
    }
  ]
}
