    {
      "parameter": "Password Policy: History",
      "category": "Access Control",
      "cis_id": "CIS 1.1.1",
      "severity": "medium",
      "mitigation": "Riwayat sandi minimal 24.",
      "check": {
        "type": "command",
        "argv": [
          "powershell",
          "-NoProfile",
          "-Command",
          "$t = (net accounts | Out-String); if ($t -match '(?im)^(?:Password history|Riwayat sandi)[^\\n]*(\\d+)') { [int]$Matches[1] }"
        ],
        "min": 24,
        "timeout": 10
      }
    },
    {
      "parameter": "Password Policy: Maximum Age",
      "category": "Access Control",
      "cis_id": "CIS 1.1.3",
      "severity": "low",
      "mitigation": "Maksimal usia sandi <= 365 hari.",
      "check": {
        "type": "command",
        "argv": [
          "powershell",
          "-NoProfile",
          "-Command",
          "$t = (net accounts | Out-String); if ($t -match '(?im)^(?:Maximum password age|Usia sandi maksimum)[^\\n]*(\\d+)') { [int]$Matches[1] }"
        ],
        "min": 1,
        "max": 365,
        "timeout": 10
      }
    },
    {
      "parameter": "Password Policy: Complexity",
      "category": "Access Control",
