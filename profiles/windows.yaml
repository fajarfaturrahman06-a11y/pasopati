    {
      "parameter": "NetBIOS over TCP/IP Disabled",
      "category": "Network & Port",
      "cis_id": "CIS 18.9.65.4",
      "severity": "medium",
      "mitigation": "Set NetbiosOptions=2 di semua antarmuka.",
      "check": {
        "type": "command",
        "argv": [
          "powershell",
          "-NoProfile",
          "-Command",
          "(Get-ChildItem 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NetBT\\Parameters\\Interfaces' | ForEach-Object { (Get-ItemProperty $_.PSPath).NetbiosOptions }) -join ','"
        ],
        "output": "^2(,2)*$",
        "timeout": 12
      }
    },
