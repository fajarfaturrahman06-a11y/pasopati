name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Typecheck + ESLint
        run: npm run lint

      - name: Python compile
        run: python -m py_compile app.py pasopati_audit.py pasopati_remediate.py

      - name: Build frontend
        run: npm run build

      - name: Test suite
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev
